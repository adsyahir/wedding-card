<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Kad jemputan perkahwinan">
  <!--
    A single band, not two, and not a monogram.
    Rendered at the size this is actually used, 16px, two interlocking
    rings merge into one blob and initials collapse into a smudge — both
    were tried and discarded. One thick ring is the most detail that
    survives. Initials would also go stale the moment the couple's names
    change in the admin settings, which a static file cannot see.

    Goldenrod tile with a cream ring rather than the reverse: the tab strip
    may be dark or light, and a solid accent block stays findable among
    twenty tabs in either.
  -->
  <rect width="32" height="32" rx="7" fill="#C9A227"/>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#FAF6EF" stroke-width="3.6"/>
</svg>
